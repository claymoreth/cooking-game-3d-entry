<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Copper Ladle Kitchen — 3D Cooking Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2b1d10; height: 100%; }
  body {
    font-family: "Trebuchet MS", Verdana, sans-serif;
    display: flex; align-items: center; justify-content: center;
    color: #3a2a18;
  }
  #app {
    position: relative;
    width: 1280px; height: 720px;
    max-width: 100vw; max-height: 100vh;
    overflow: hidden;
    background: #f7e8c9;
    box-shadow: 0 0 40px rgba(0,0,0,.5);
  }
  #app.shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-5px,2px); }
    50% { transform: translate(5px,-2px); }
    75% { transform: translate(-3px,-1px); }
  }
  #game { display: block; width: 1280px; height: 720px; }
  #hud, #overlay, #bin-labels { position: absolute; inset: 0; pointer-events: none; }
  #hud { z-index: 5; }
  #overlay { z-index: 20; }
  #bin-labels { z-index: 4; }

  .top-bar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 18px;
    padding: 10px 16px;
    background: linear-gradient(rgba(111,69,32,.92), rgba(111,69,32,.82));
    color: #f7e8c9;
  }
  .game-title { font-size: 22px; font-weight: bold; letter-spacing: 1px; margin-right: auto; }
  .stat { font-size: 18px; font-weight: bold; }
  .stat .coin-icon { color: #e8a91c; font-size: 22px; margin-right: 4px; }
  #shift-value.low { color: #ff6b5e; }
  .combo-badge {
    background: #e8a91c; color: #3a2a18; font-weight: bold;
    padding: 4px 10px; border-radius: 20px; font-size: 16px;
  }
  .hud-btn {
    pointer-events: auto; cursor: pointer;
    width: 38px; height: 38px; font-size: 18px; font-weight: bold;
    background: #f7e8c9; color: #6f4520; border: none; border-radius: 8px;
  }
  .hud-btn.muted { background: #888; color: #fff; }

  .order-board {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px;
  }
  .waiting { background: rgba(255,255,255,.85); padding: 8px 14px; border-radius: 10px; font-weight: bold; }
  .ticket {
    width: 210px; background: #fff8e6; border: 3px solid #8a5a2b; border-radius: 12px;
    padding: 8px 10px; box-shadow: 0 3px 8px rgba(0,0,0,.25);
  }
  .ticket.ready { border-color: #2e9e4f; box-shadow: 0 0 14px rgba(46,158,79,.8); }
  .ticket.urgent { animation: blink .5s infinite alternate; }
  @keyframes blink { from { border-color: #d43d2a; } to { border-color: #ffb3ab; } }
  .ticket-head { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; }
  .ticket-coins { color: #b98a12; }
  .ticket-icons { display: flex; gap: 6px; margin: 6px 0; align-items: center; }
  .ing-dot {
    display: inline-block; width: 24px; height: 24px; border-radius: 50%;
    color: #fff; font-size: 13px; font-weight: bold; line-height: 24px; text-align: center;
    border: 2px solid rgba(0,0,0,.25);
  }
  .bowl-note { font-size: 12px; font-style: italic; color: #8a5a2b; }
  .ticket-time { display: flex; align-items: center; gap: 8px; }
  .ticket-seconds { font-weight: bold; min-width: 28px; }
  .ticket-bar { flex: 1; height: 8px; background: #e0cfa8; border-radius: 4px; overflow: hidden; }
  .ticket-fill { height: 100%; background: #2e9e4f; }
  .serve-btn {
    pointer-events: auto; cursor: pointer; margin-top: 7px; width: 100%;
    background: #2e9e4f; color: #fff; border: none; border-radius: 8px;
    padding: 7px 0; font-size: 16px; font-weight: bold; letter-spacing: 1px;
  }

  .popup {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%,-50%);
    text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .popup-main { font-size: 52px; font-weight: bold; color: #e8a91c; }
  .popup-sub { font-size: 30px; font-weight: bold; color: #e8701c; }
  .rush-banner {
    position: absolute; top: 150px; left: 50%; transform: translateX(-50%);
    background: #d43d2a; color: #fff; font-size: 34px; font-weight: bold;
    padding: 10px 26px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
    animation: blink .4s infinite alternate;
  }
  .ready-label {
    position: absolute; top: 430px; left: 50%; transform: translateX(-50%);
    background: #2e9e4f; color: #fff; font-weight: bold; font-size: 20px;
    padding: 6px 16px; border-radius: 20px;
  }
  #mismatch {
    position: absolute; top: 470px; left: 50%; transform: translateX(-50%);
    background: rgba(212,61,42,.92); color: #fff; font-weight: bold; font-size: 16px;
    padding: 6px 14px; border-radius: 10px; z-index: 6;
  }
  #cursor-label {
    position: absolute; z-index: 7; pointer-events: none;
    background: rgba(58,42,24,.9); color: #f7e8c9; font-size: 14px; font-weight: bold;
    padding: 4px 10px; border-radius: 8px; white-space: nowrap;
  }
  .bin-label {
    position: absolute; width: 110px; text-align: center;
    background: rgba(255,248,230,.92); border: 2px solid #8a5a2b; border-radius: 8px;
    font-size: 13px; padding: 3px 4px; line-height: 1.25;
  }

  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(43,29,16,.72); color: #f7e8c9; pointer-events: auto;
  }
  .screen h1 { font-size: 54px; letter-spacing: 2px; color: #e8a91c; text-shadow: 0 3px 0 #6f4520; }
  .screen .subtitle { font-size: 20px; margin: 14px 0 20px; max-width: 720px; }
  .screen .howto { font-size: 17px; margin: 4px 0; }
  .screen .start-hint { font-size: 26px; font-weight: bold; margin-top: 26px; color: #fff; animation: blink 1s infinite alternate; }
  .screen .start-hint.small { font-size: 16px; margin-top: 6px; animation: none; }
  .screen p { font-size: 19px; margin: 5px 0; }
  .screen strong { color: #e8a91c; }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="bin-labels"></div>
  <div id="hud"></div>
  <div id="mismatch" style="display:none">doesn't match any order — trash it!</div>
  <div id="cursor-label" style="display:none"></div>
  <div id="overlay"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
